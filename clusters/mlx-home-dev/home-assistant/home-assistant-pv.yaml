---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: home-assistant-volume
  namespace: home-assistant
spec:
  storageClassName: longhorn
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: home-assistant-volume
