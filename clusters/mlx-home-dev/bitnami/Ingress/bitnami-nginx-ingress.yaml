---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "nginx-ingress"
  namespace: "bitnami-nginx"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`dev-nginx1.mlxsolutions.com`)
      services:
        - kind: Service
          name: bitnami-nginx
          namespace: bitnami-nginx
          passHostHeader: true
          port: 80