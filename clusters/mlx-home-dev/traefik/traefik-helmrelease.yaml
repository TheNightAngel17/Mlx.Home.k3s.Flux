---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  chart:
    spec:
      chart: traefik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    createNamespace: true
  interval: 1m0s
  releaseName: traefik
  targetNamespace: traefik
  values:
    autoscaling:
      enabled: true
      maxReplicas: 2
      metrics:
      - resource:
          name: cpu
          target:
            averageUtilization: 80
            type: Utilization
        type: Resource
    deployment:
      replicas: null
    ingressRoute:
      dashboard:
        enabled: true
    resources:
      limits:
        cpu: 300m
        memory: 150Mi
      requests:
        cpu: 100m
        memory: 50Mi
