apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole-ingress
  namespace: pihole
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`dev-pihole.thelemonsclan.com`) 
      services:
        - kind: Service
          name: pihole-web
          passHostHeader: true
          port: 80