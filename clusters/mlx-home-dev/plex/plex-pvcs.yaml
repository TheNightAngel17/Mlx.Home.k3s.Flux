---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-data
  namespace: plex
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-cifs-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: smb.csi.k8s.io
    volumeAttributes:
      source: //10.17.16.100/Media
    volumeHandle: plex-cifs-volume
    nodeStageSecretRef:
      name: plex-cifs-secret
    namespace: plex
   mountOptions:
     - dir_mode=0775
     - file_mode=0775
---
apiVersion: v1
kind: PersistentVolumeClaim 
metadata: 
  name: plex-cifs-pvc
  namespace: plex
spec: 
  accessModes:
    - ReadWriteMany 
resources:    
  requests:      
    storage: 100Gi
  volumeName: plex-cifs-pv