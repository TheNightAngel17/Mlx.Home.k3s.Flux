
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: 6hr-snapshot
  namespace: longhorn-system
spec:
  cron: "0 2/6 * * *" # Every 6 hours starting at 02:00
  task: "snapshot"
  groups:
  - default
  retain: 12
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 4 * * *" # Every day at 04:00
  task: "backup"
  groups:
  - default
  retain: 30
  concurrency: 1
  parameters:
    fill-backup-interval: "7"
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot-cleanup
  namespace: longhorn-system
spec:
  cron: "30 5 * * *" # Every day at 05:30
  task: "snapshot-cleanup"
  groups:
  - default
  retain: 0
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-snapshot-delete
  namespace: longhorn-system
spec:
  cron: "0 5 * * 0" # Every Sunday at 05:00
  task: "snapshot-delete"
  groups:
  - default
  retain: 12
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: monthly-filesystem-trim
  namespace: longhorn-system
spec:
  cron: "0 6 1 * *" # Every month on the 1st at 06:00
  task: "filesystem-trim"
  groups:
  - default
  retain: 0
  concurrency: 1