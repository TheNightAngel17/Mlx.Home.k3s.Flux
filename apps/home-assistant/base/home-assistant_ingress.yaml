---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant-ingress
  namespace: home-assistant
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ha.thelemonsclan.com`)
      services:
        - kind: Service
          name: home-assistant
          passHostHeader: true
          port: 8080
    - kind: Rule
      match: Host(`ha-code.thelemonsclan.com`)
      services:
        - kind: Service
          name: home-assistant-codeserver
          passHostHeader: true
          port: 12321
