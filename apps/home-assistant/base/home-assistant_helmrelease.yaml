---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  chart:
    spec:
      chart: home-assistant
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: home-assistant
        namespace: flux-system
      version: 0.2.x # base neutral (prod)
  interval: 1m0s
  timeout: 10m
  releaseName: home-assistant
  targetNamespace: home-assistant
  values:
    image:
      tag: "2025.4" # prod baseline
    env:
    - name: TZ
      value: America/Chicago
    addons:
      codeserver:
        enabled: true
