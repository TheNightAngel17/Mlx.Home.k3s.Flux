apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  chart:
    spec:
      version: 34.5.x
  values:
    # certificatesResolvers:
    #   letsencrypt:
    #     acme:
    #       email: "lemonsml@outlook.com"
    #       storage: /data/acme.json
    #       # caServer: https://acme-v02.api.letsencrypt.org/directory # Production server
    #       caServer: https://acme-staging-v02.api.letsencrypt.org/directory # Staging server
    #       dnsChallenge:
    #         provider: cloudflare
    #         delayBeforeCheck: 0
    # env:
    #   - name: CF_DNS_API_TOKEN
    #     valueFrom:
    #       secretKeyRef:
    #         name: cloudflare-api-token-secret
    #         key: api-token
    ingressRoute:
      dashboard:
        enabled: true
    deployment:
      replicas: null
    resources:
      requests:
        cpu: "300m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"
    autoscaling:
      enabled: true
      maxReplicas: 10
      minReplicas: 2
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 80
