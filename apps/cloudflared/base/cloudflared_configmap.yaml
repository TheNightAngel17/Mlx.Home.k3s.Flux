---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared-tunnel
data:
  # Generic baseline; env-specific tunnel name and ingress rules supplied via overlays
  config.yaml: |
    tunnel: cloudflared-tunnel
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
    - service: http_status:404
