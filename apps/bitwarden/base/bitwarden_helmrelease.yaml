# Base (production source copied). Dev differences will be patches.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden
  namespace: flux-system
spec:
  chart:
    spec:
      chart: self-host
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: bitwarden
        namespace: flux-system
      version: 2024.12.x
  interval: 1m0s
  timeout: 10m
  releaseName: bitwarden
  targetNamespace: bitwarden
  values:
    general:
      domain: "bitwarden.thelemonsclan.com"
      ingress:
        enabled: false
        className: nginx
        tls:
          name: bitwarden-tls-secret
          clusterIssuer: cloudflare-issuer
        paths:
          web: { path: /(.*), pathType: ImplementationSpecific }
          attachments: { path: /attachments/(.*), pathType: ImplementationSpecific }
          api: { path: /api/(.*), pathType: ImplementationSpecific }
          icons: { path: /icons/(.*), pathType: ImplementationSpecific }
          notifications: { path: /notifications/(.*), pathType: ImplementationSpecific }
          events: { path: /events/(.*), pathType: ImplementationSpecific }
          scim: { path: /scim/(.*), pathType: ImplementationSpecific }
          sso: { path: /(sso/.*), pathType: ImplementationSpecific }
          identity: { path: /(identity/.*), pathType: ImplementationSpecific }
          admin: { path: /(admin/?.*), pathType: ImplementationSpecific }
    sharedStorageClassName: longhorn
    secrets:
      secretName: bitwarden-secret
    volume:
      dataprotection: { existingClaim: bitwarden-self-host-dataprotection }
      attachments: { existingClaim: bitwarden-self-host-attachments }
      licenses: { existingClaim: bitwarden-self-host-licenses }
      logs: { enabled: false, existingClaim: bitwarden-self-host-logs }
    database:
      enabled: true
      image:
        name: mcr.microsoft.com/mssql/server
        tag: 2022-CU11-ubuntu-22.04
      volume:
        backups: { existingClaim: bitwarden-self-host-mssqlbackups }
        data: { existingClaim: bitwarden-self-host-mssqldata }
        log: { existingClaim: bitwarden-self-host-mssqllog }
  # NOTE: Remaining values identical between envs omitted for brevity.
