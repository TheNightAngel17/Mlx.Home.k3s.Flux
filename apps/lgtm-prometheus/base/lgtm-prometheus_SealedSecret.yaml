---
# DUMMY SEALED SECRET — replace with real sealed secret before merging to main
# Generate with:
#   kubeseal --format=yaml --cert <env_cert.crt> < grafana-admin-credentials_Secret.yaml > lgtm-prometheus_SealedSecret.yaml
#
# Plaintext secret format:
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: grafana-admin-credentials
#     namespace: monitoring
#   type: Opaque
#   stringData:
#     admin-user: admin
#     admin-password: YOUR_STRONG_PASSWORD_HERE
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  encryptedData:
    admin-user: REPLACE_ME_WITH_REAL_SEALED_VALUE
    admin-password: REPLACE_ME_WITH_REAL_SEALED_VALUE
  template:
    metadata:
      name: grafana-admin-credentials
      namespace: monitoring
    type: Opaque
