---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo-release
  namespace: flux-system
spec:
  chart:
    spec:
      chart: tempo
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana-repo
        namespace: flux-system
      version: 1.x
  interval: 1m0s
  releaseName: tempo
  targetNamespace: monitoring
  install:
    createNamespace: false
  values:
    tempo:
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
      retention: 72h
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
