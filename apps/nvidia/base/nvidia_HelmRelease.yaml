apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-feature-discovery
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: gpu-feature-discovery
      version: 0.17.3
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    runtimeClassName: nvidia
    # nodeSelector:
    #   hardware.accelerator: "nvidia"
    # tolerations:
    #   - operator: Exists
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: nvidia-device-plugin
      version: 0.17.3        # Chart/App version from your helm search
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    runtimeClassName: nvidia
    migStrategy: none
    failOnInitError: true
    # If you label GPU nodes manually, you could restrict:
    # nodeSelector:
    #   hardware.accelerator: "nvidia"
    # tolerations:
    #   - operator: Exists